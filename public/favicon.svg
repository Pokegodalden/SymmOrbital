<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="symmLogoBg" x1="6" y1="6" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- High-Contrast Background Badge -->
  <rect x="5" y="5" width="110" height="110" rx="24" fill="url(#symmLogoBg)" stroke="#3B82F6" stroke-width="4" />
  <!-- Left AO Energy Rung -->
  <line x1="15" y1="60" x2="34" y2="60" stroke="#CBD5E1" stroke-width="5.5" stroke-linecap="round" />
  <!-- Right AO Energy Rung -->
  <line x1="86" y1="60" x2="105" y2="60" stroke="#CBD5E1" stroke-width="5.5" stroke-linecap="round" />
  <!-- Top Antibonding LUMO (psi*) Rung -->
  <line x1="44" y1="24" x2="76" y2="24" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" />
  <!-- Bottom Bonding HOMO (psi) Rung -->
  <line x1="44" y1="96" x2="76" y2="96" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <!-- SALC Correlation Dashed Lines Forming a Diamond -->
  <line x1="34" y1="60" x2="44" y2="24" stroke="#94A3B8" stroke-width="2.8" stroke-dasharray="4 4" />
  <line x1="86" y1="60" x2="76" y2="24" stroke="#94A3B8" stroke-width="2.8" stroke-dasharray="4 4" />
  <line x1="34" y1="60" x2="44" y2="96" stroke="#94A3B8" stroke-width="2.8" stroke-dasharray="4 4" />
  <line x1="86" y1="60" x2="76" y2="96" stroke="#94A3B8" stroke-width="2.8" stroke-dasharray="4 4" />
  <!-- Central Dual-Phase p-Orbital Inside the Correlation Diamond -->
  <path d="M60 60 C44 48, 44 32, 60 32 C76 32, 76 48, 60 60 Z" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.5" />
  <path d="M60 60 C44 72, 44 88, 60 88 C76 88, 76 72, 60 60 Z" fill="#F43F5E" stroke="#FDA4AF" stroke-width="1.5" />
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF" />
</svg>
