<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="posLobe1" x1="30" y1="15" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="negLobe1" x1="60" y1="60" x2="90" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <!-- Subtle Nodal Mirror Plane (sigma_h) -->
  <ellipse cx="60" cy="60" rx="42" ry="13" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3" fill="#1E293B" fill-opacity="0.35" />
  <!-- Principal C_n Rotation Axis -->
  <line x1="60" y1="12" x2="60" y2="108" stroke="#38BDF8" stroke-width="1.75" stroke-dasharray="3 3" />
  <!-- Positive Phase Lobe (psi > 0, Top-Left to Center) -->
  <path d="M60 60 C34 52, 22 24, 44 16 C64 9, 74 36, 60 60 Z" fill="url(#posLobe1)" opacity="0.95" stroke="#93C5FD" stroke-width="1.2" />
  <!-- Negative Phase Lobe (psi < 0, Bottom-Right to Center) -->
  <path d="M60 60 C86 68, 98 96, 76 104 C56 111, 46 84, 60 60 Z" fill="url(#negLobe1)" opacity="0.95" stroke="#FDA4AF" stroke-width="1.2" />
  <!-- 2D Skeletal Benzene Ring Overlay -->
  <polygon points="60,34 82.5,47 82.5,73 60,86 37.5,73 37.5,47" stroke="#F8FAFC" stroke-width="2.2" fill="none" stroke-linejoin="round" />
  <!-- Central Nucleus Node -->
  <circle cx="60" cy="60" r="4.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <!-- Phase Signs (+ / -) -->
  <text x="45" y="36" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">+</text>
  <text x="75" y="92" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">−</text>
</svg>
