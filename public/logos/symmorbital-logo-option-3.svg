<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <!-- Isometric Octahedral Point Group Wireframe (Oh / C3v) -->
  <polygon points="60,14 102,60 60,106 18,60" stroke="#334155" stroke-width="1.75" fill="#1E293B" fill-opacity="0.3" />
  <line x1="18" y1="60" x2="102" y2="60" stroke="#334155" stroke-width="1.25" stroke-dasharray="3 3" />
  <line x1="60" y1="14" x2="60" y2="106" stroke="#334155" stroke-width="1.25" stroke-dasharray="3 3" />
  <!-- Interlocking 'S' + 'O' Orbital Ribbon -->
  <!-- Outer 'O' Ring (Symmetry Orbit) -->
  <ellipse cx="60" cy="60" rx="34" ry="18" transform="rotate(-30 60 60)" stroke="#3B82F6" stroke-width="5" />
  <!-- Intersecting 'S' Wavefunction Phase Curve -->
  <path d="M76 28 C44 24, 34 52, 60 60 C86 68, 76 96, 44 92" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" />
  <!-- Symmetry Vertices -->
  <circle cx="60" cy="14" r="3.5" fill="#38BDF8" />
  <circle cx="60" cy="106" r="3.5" fill="#38BDF8" />
  <circle cx="18" cy="60" r="3.5" fill="#94A3B8" />
  <circle cx="102" cy="60" r="3.5" fill="#94A3B8" />
  <circle cx="60" cy="60" r="5" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
</svg>
